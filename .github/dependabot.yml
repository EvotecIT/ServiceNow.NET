version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      include:
        - '*'
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: Microsoft.PowerShell.SDK
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # These packages share MicrosoftDependencyVersion. Review major upgrades across all supported targets.
      - dependency-name: Microsoft.Bcl.AsyncInterfaces
        update-types:
          - version-update:semver-major
      - dependency-name: Microsoft.Extensions.DependencyInjection
        update-types:
          - version-update:semver-major
      - dependency-name: Microsoft.Extensions.Http
        update-types:
          - version-update:semver-major
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types:
          - version-update:semver-major
      - dependency-name: System.Security.Cryptography.Xml
        update-types:
          - version-update:semver-major
      - dependency-name: System.Text.Json
        update-types:
          - version-update:semver-major
    groups:
      all-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      include:
        - '*'
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - '*'
